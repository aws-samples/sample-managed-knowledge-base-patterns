[project]
name = "kb-agent"
version = "0.1.0"
description = "Strands agent that searches a Managed Knowledge Base through AgentCore Gateway"
requires-python = ">=3.13"
dependencies = [
    "bedrock-agentcore>=1.25.0",
    "mcp>=2.1.1",
    "strands-agents>=1.62.0",
]

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.2",
]

[project]
name = "retrieval-instructions-sample"
version = "0.1.0"
description = "Per-tenant retrieval instructions for Amazon Bedrock Managed Knowledge Base (AWS SDK for Python)"
license = "MIT-0"
requires-python = ">=3.10"
dependencies = ["boto3>=1.43.118"]

[project.scripts]
ri-sample = "ri_sample.cli:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ri_sample"
module-root = "python/src"

[dependency-groups]
dev = ["mypy>=2.4.1", "pytest>=9.1.1", "ruff>=0.17.2"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["python/src", "python/tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["python/src", "python/tests"]

[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["python/tests"]
